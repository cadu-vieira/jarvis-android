name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Baixar Sherpa-ONNX
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/sherpa-onnx-1.13.7.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          test -s app/libs/sherpa-onnx-1.13.7.aar

      - name: Adicionar dependência Sherpa-ONNX
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          dependency = '    implementation(files("libs/sherpa-onnx-1.13.7.aar"))'
          if dependency not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit("Bloco dependencies não encontrado.")
              text = text.replace(marker, marker + "\n" + dependency, 1)
              path.write_text(text)
          PY

      - name: Baixar API Kotlin do Sherpa
        run: |
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          curl -L -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/master/sherpa-onnx/kotlin-api/Tts.kt
          test -s app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

      - name: Baixar modelo Kokoro George
        run: |
          mkdir -p /tmp/kokoro
          cd /tmp/kokoro
          curl -L -o kokoro.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          tar -xjf kokoro.tar.bz2
          rm kokoro.tar.bz2

      - name: Instalar arquivos Kokoro
        run: |
          rm -rf app/src/main/assets/kokoro
          mkdir -p app/src/main/assets/kokoro
          cp -a /tmp/kokoro/kokoro-int8-multi-lang-v1_0/. app/src/main/assets/kokoro/

      - name: Verificar Kokoro
        run: |
          test -f app/src/main/assets/kokoro/model.int8.onnx
          test -f app/src/main/assets/kokoro/voices.bin
          test -f app/src/main/assets/kokoro/tokens.txt
          test -f app/src/main/assets/kokoro/lexicon-gb-en.txt
          test -d app/src/main/assets/kokoro/espeak-ng-data
          echo "KOKORO OK"

      - name: Verificar Tts.kt
        run: |
          grep -q "class OfflineTts" app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt
          echo "TTS API OK"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Verificar APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
